name: Mingrx Site Validation

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site-validation.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare the licensed self-hosted font
        run: node site/prepare-fonts.mjs
      - name: Lint website JavaScript
        run: npm exec --yes --package=eslint@10.14.0 -- eslint --config site/eslint.config.mjs site/
      - name: Validate static site
        run: node site/validate.mjs && node site/test-invites.mjs
